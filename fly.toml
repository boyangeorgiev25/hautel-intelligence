# Hautel Intelligence engine API — Fly.io, Frankfurt (same region as the Supabase project).
app = "hautel-intelligence-api"
primary_region = "fra"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  HAUTEL_API_AUTH = "on"
