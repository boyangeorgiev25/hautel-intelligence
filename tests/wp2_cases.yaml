# WP2 golden test cases — "5–10 matches with expected outcomes" per the sprint plan,
# extended to cover the §9 uncertainties: matching quality (1), multilingual NL/FR (3),
# orchestration robustness (4). Expected outcomes were fixed BEFORE the engine ran.
#
# expected.decision: match | escalate | either
# expected.consultants: acceptable top-1 consultant ids when the decision is match
# expected.low_confidence_ok: a match with top score < 0.5 also counts as correct
#   (the engine flagged the gap instead of overselling)
# overrides.candidate_filter / overrides.fail_sink: robustness scenarios

